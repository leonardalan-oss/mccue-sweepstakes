<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>McCue Family Sweep Stakes · World Cup 2026</title>
  <meta name="description" content="The McCue family World Cup 2026 sweepstakes. Pick four teams, watch them play, win the family pool.">

  <!-- Open Graph tags (these power WhatsApp, iMessage, Slack link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="McCue Family Sweep Stakes — World Cup 2026">
  <meta property="og:description" content="Pick four teams. Watch them play. Win the family pool.">
  <meta property="og:image" content="banner.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="McCue Family Sweep Stakes — World Cup 2026">
  <meta name="twitter:description" content="Pick four teams. Watch them play. Win the family pool.">
  <meta name="twitter:image" content="banner.jpg">

  <link rel="icon" type="image/png" href="banner.jpg">
  <link rel="preload" as="image" href="banner.jpg">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #0a1838;
      color: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 17px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    input, button { font-family: inherit; font-size: inherit; }
    input::placeholder { color: #646883; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #06112a; }
    ::-webkit-scrollbar-thumb { background: #a87f1f; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #d4a02c; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
      50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }
    .live-dot { animation: pulse-dot 1.8s ease-in-out infinite; }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fade-in-up 0.45s ease-out; }
    @keyframes confetti-pop {
      0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .confetti-pop { animation: confetti-pop 0.6s ease-out; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    .gold-text {
      background: linear-gradient(135deg, #f0c14b 0%, #d4a02c 50%, #b88820 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gold-btn {
      background: linear-gradient(180deg, #f0c14b 0%, #d4a02c 50%, #b88820 100%);
      color: #06112a;
      border: none;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(212,160,44,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .gold-btn:hover:not(:disabled) {
      box-shadow: 0 6px 24px rgba(212,160,44,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
      transform: translateY(-1px);
    }
    .gold-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(212,160,44,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .gold-btn:disabled {
      background: rgba(255,255,255,0.08);
      color: #646883;
      box-shadow: none;
    }
    .app-bg {
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,160,44,0.08), transparent 50%),
        radial-gradient(ellipse 60% 50% at 20% 100%, rgba(200,48,42,0.05), transparent 50%);
    }
  </style>
</head>

// Free tier, no auth, atomic per-player writes (no race conditions)
const FB_URL = "https://mccue-sweepstakes-default-rtdb.europe-west1.firebasedatabase.app";

async function fbFetch(path, opts={}, ms=8000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(FB_URL + path, {...opts, signal:ctrl.signal});
    clearTimeout(t);
    return r;
  }catch(e){ clearTimeout(t); throw e; }
}

async function pantryLoad(){
  try{
    const r = await fbFetch("/players.json");
    if(!r.ok) return {players:{}};
    const data = await r.json();
    if(!data) return {players:{}};
    return {players: data};
  }catch(e){
    console.error("Load failed:", e);
    return null;
  }
}

async function pantryWrite(data){
  try{
    const players = data.players || {};
    // PATCH each player to their own path - Firebase PATCH is atomic per path
    await Promise.all(Object.entries(players).map(([id, player]) =>
      fbFetch("/players/" + id + ".json", {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(player)
      })
    ));
    return true;
  }catch(e){
    console.error("Write failed:", e);
    return false;
  }
}

async function pantryReset(){
  try{
    await fbFetch("/players.json", {method:"DELETE"});
    return true;
  }catch(e){
    console.error("Reset failed:", e);
    return false;
  }
}

async function pantryRemovePlayer(playerId){
  try{
    await fbFetch("/players/" + playerId + ".json", {method:"DELETE"});
    return true;
  }catch(e){
    console.error("Remove failed:", e);
    return false;
  }
